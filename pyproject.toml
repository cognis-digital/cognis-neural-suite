[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognis-livesearch"
version = "0.5.2"
description = "Keyless, real-time web-search and RSS/Atom feed ingestion (standard library only)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "COCL-1.0" }
authors = [{ name = "Cognis Digital" }]
keywords = ["osint", "rss", "atom", "web-search", "monitoring", "feeds"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
livesearch = "livesearch:_entry"

[project.urls]
Homepage = "https://github.com/cognis-digital/cognis-neural-suite"
Source = "https://github.com/cognis-digital/cognis-neural-suite"

[tool.setuptools]
py-modules = ["livesearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
